name: CI/CD

on:
  push:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: yarn install --frozen-lockfile 

      - name: Typecheck
        run: yarn typecheck
